[versions]
agp = "8.13.2"
kotlin = "2.0.0"
coreKtx = "1.10.1"
junit = "4.13.2"
junitVersion = "1.1.5"
espressoCore = "3.5.1"
lifecycleRuntimeKtx = "2.8.7"
activityCompose = "1.8.0"
composeBom = "2024.04.01"

firebasebom = "33.9.0"  # Define la versión del Firebase BoM
service = "4.4.2"
crashlytics = "3.0.3"
navegationCompose = "2.8.8"
kotlinxSerialization = "1.8.0"
hilt = "2.51.1"
hiltNavigationCompose = "1.2.0"
firebaseAuth = "24.0.1"
foundation = "1.9.5"
coil = "2.4.0"



[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycleRuntimeKtx" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
androidx-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
androidx-material3 = { group = "androidx.compose.material3", name = "material3" }


firebase-bom = { module = "com.google.firebase:firebase-bom", version.ref="firebasebom"} #archivo especial que gestiona todas las bibliotecas de firebase, en lugar de especificar cada dependencia de firebase
firebase-crashlytics = {module = "com.google.firebase:firebase-crashlytics"} # Permite monitorear y analizar fallos (crashes), proporcionando informes detallados sobre los errores
firebase-auth = {module = "com.google.firebase:firebase-auth-ktx"} # Para la autentificación de los usuarios
firebase-firestore = {module="com.google.firebase:firebase-firestore"}

androidx-navigation-compose = {module = "androidx.navigation:navigation-compose", version.ref = "navegationCompose"} # una biblioteca que permite manejar la navegacion entre jetpack compose
kotlinx-serialization-json = {module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinxSerialization"} # permite convertir objetos kotlin en formatos como JSON, XML, etc, y viceversa

#hiltNavigationCompose
androidx-hilt-navigation-compose = {module = "androidx.hilt:hilt-navigation-compose", version.ref = "hiltNavigationCompose"}


#hilt
hilt-android = { group = "com.google.dagger", name = "hilt-android", version.ref = "hilt" }
hilt-compiler = { group = "com.google.dagger", name = "hilt-android-compiler", version.ref = "hilt" }
google-firebase-auth = { group = "com.google.firebase", name = "firebase-auth", version.ref = "firebaseAuth" }
androidx-compose-foundation = { group = "androidx.compose.foundation", name = "foundation", version.ref = "foundation" }

coil-compose = { module = "io.coil-kt:coil-compose", version.ref = "coil" }





[plugins]
googleServices = { id = "com.google.gms.google-services", version.ref = "service" } # para configurar servicios de google, su función principal procesar archivos google-service-json, generando los recursos necesarios para que firebase funcione
crashlytics = {id = "com.google.firebase.crashlytics", version.ref = "crashlytics"}

hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt"}


android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
jetbrainsKotlinSerialization = {id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin"} #habilita la serialización de kotlin en el proyecto



